<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container py-5">

    <!-- HEADER -->

    <div class="text-center mb-5">

        <h1>🌤️ Weather Dashboard</h1>

        <p>Explore weather conditions around the world</p>

    </div>


    <!-- SEARCH BAR -->

    <div class="search-box mx-auto mb-4">

        <div class="input-group">

            <input
                type="text"
                id="cityInput"
                class="form-control"
                placeholder="Search a city..."
            >

            <button
                class="btn btn-primary"
                id="searchButton">

                Search

            </button>

        </div>

    </div>


    <!-- SEARCH HISTORY -->

    <div class="text-center mb-4">

        <h6>Recently Searched</h6>

        <div id="searchHistory"></div>

    </div>


    <!-- LOADING -->

    <div id="loader" class="text-center d-none">

        <div class="spinner-border text-light"></div>

        <p class="mt-2">Fetching weather information...</p>

    </div>


    <!-- ERROR -->

    <div id="errorMessage"
         class="text-center text-warning mb-4">

    </div>


    <!-- MAIN WEATHER DASHBOARD -->

    <div id="weatherDashboard" class="d-none">

        <!-- CURRENT WEATHER -->

        <div class="main-weather text-center mb-5">

            <h2 id="cityName"></h2>

            <p id="localTime"></p>

            <div id="weatherIcon" class="weather-icon"></div>

            <h1 id="temperature"></h1>

            <h4 id="weatherDescription"></h4>

        </div>


        <!-- WEATHER DETAILS -->

        <h3 class="section-title">Weather Details</h3>

        <div class="row g-4 mb-5">

            <div class="col-md-4">

                <div class="weather-card">

                    <h5>🌡️ Feels Like</h5>

                    <h3 id="feelsLike"></h3>

                </div>

            </div>


            <div class="col-md-4">

                <div class="weather-card">

                    <h5>💧 Humidity</h5>

                    <h3 id="humidity"></h3>

                </div>

            </div>


            <div class="col-md-4">

                <div class="weather-card">

                    <h5>💨 Wind Speed</h5>

                    <h3 id="windSpeed"></h3>

                </div>

            </div>

        </div>


        <!-- 5 DAY FORECAST -->

        <h3 class="section-title mb-4">5-Day Weather Forecast</h3>

        <div class="row g-3" id="forecastContainer"></div>

    </div>


    <!-- FOOTER -->

    <footer class="text-center mt-5">

        Weather data powered by
        <a href="https://open-meteo.com/" target="_blank">
            Open-Meteo
        </a>

    </footer>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
